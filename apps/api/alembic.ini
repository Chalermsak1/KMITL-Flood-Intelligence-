[alembic]
script_location = ../../infra/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql://kmitl_flood_user:kmitl_flood_password_secure@localhost:5432/kmitl_flood_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
