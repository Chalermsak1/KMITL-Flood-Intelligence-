name: KMITL Flood Intelligence CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. QUALITY ASSURANCE & UNIT TESTS
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend Test Suite (FastAPI + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kmitl_flood_user
          POSTGRES_PASSWORD: kmitl_flood_password_secure
          POSTGRES_DB: kmitl_flood_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://kmitl_flood_user:kmitl_flood_password_secure@localhost:5432/kmitl_flood_db"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          PYTHONPATH=apps/api pytest apps/api/tests/ -v --junitxml=test-results.xml

  test-frontend:
    name: Frontend Lint & Production Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Next.js Type Check & Build
        working-directory: apps/web
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. CONTAINER BUILD & SECURITY SCAN
  # ---------------------------------------------------------------------------
  build-containers:
    name: Build & Security Audit Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        run: |
          docker build -t kmitl-flood-api:${{ github.sha }} -f apps/api/Dockerfile.prod apps/api

      - name: Build Web Image
        run: |
          docker build -t kmitl-flood-web:${{ github.sha }} -f apps/web/Dockerfile.prod apps/web

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "kmitl-flood-api:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ---------------------------------------------------------------------------
  # 3. DEPLOY TO STAGING (Automated on Master)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to AWS ECS Staging
    needs: build-containers
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Staging ECS Task Update
        run: |
          echo "Simulating automated deployment to ECS Staging cluster..."
          echo "Migrating DB with Alembic..."
          echo "Deploying API and Worker fleet..."
          echo "Staging deployment complete."

  # ---------------------------------------------------------------------------
  # 4. DEPLOY TO PRODUCTION (Manual Approval Gate)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to AWS ECS Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://flood.kmitl.ac.th
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Production Deployment
        run: |
          echo "Production deployment initiated under supervised operator gate..."
          echo "Taking pre-deployment RDS database snapshot..."
          echo "Applying zero-downtime Alembic schema migration..."
          echo "Rolling ECS Task update with healthy percent 100/200..."
          echo "Performing post-deployment synthetic health check..."
